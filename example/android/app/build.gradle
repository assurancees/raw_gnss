plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "dev.assurancees.raw_gnss_2025_example"
    compileSdkVersion 36

    defaultConfig {
        applicationId "dev.assurancees.raw_gnss_2025_example"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders = [applicationName: "io.flutter.app.FlutterApplication"]
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

flutter {
    source '../..'
}

dependencies {
}

// Copy APK outputs to the expected Flutter build directory
android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        variant.assembleProvider.get().doLast {
            def flutterBuildDir = file("$rootDir/../build/app/outputs")
            def apkOutputDir = new File(flutterBuildDir, "flutter-apk")
            apkOutputDir.mkdirs()
            
            copy {
                from output.outputFile
                into apkOutputDir
            }
        }
    }
}

